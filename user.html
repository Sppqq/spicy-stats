<!-- File: user.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Monitor — Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --paper: #101114;
            --paper-dark: #1b1c21;
            --ink: #f1f0ea;
            --muted: #8e9099;
            --line: #2d2f39;
            --blue: #4d65ff;
            --green: #b9f227;
            --coral: #ff715b;
            --white: #16171c;
            --positive-text: #b9f227;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .brand-mark {
            width: 35px;
            height: 35px;
            display: grid;
            place-items: center;
            background: var(--ink);
            color: var(--green);
            font-size: 18px;
            transform: rotate(-8deg);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            border: 1px solid var(--ink);
        }

        .profile-header {
            padding: 70px 0 34px;
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
        }

        .back-button {
            border: 1px solid var(--ink);
            background: transparent;
            padding: 9px 13px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            transition: 140ms ease;
        }

        .back-button:hover {
            background: var(--ink);
            color: var(--white);
        }

        .eyebrow {
            color: var(--blue);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 14px;
        }

        .profile-title {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            background: var(--blue);
            color: var(--white);
            font-size: 23px;
            font-weight: 800;
            transform: rotate(4deg);
        }

        .profile-title h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 78px);
            letter-spacing: -0.08em;
            line-height: 0.9;
        }

        .profile-caption {
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            margin-top: 12px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .profile-stat {
            min-height: 155px;
            padding: 21px;
            border: 1px solid var(--ink);
            background: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-stat:nth-child(2) {
            background: var(--coral);
            color: #101114;
        }

        .profile-stat:nth-child(3) {
            background: var(--green);
            color: #101114;
        }

        .profile-stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
        }

        .profile-stat-value {
            font-size: 35px;
            font-weight: 800;
            letter-spacing: -0.07em;
        }

        .profile-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 12px;
        }

        .panel {
            border: 1px solid var(--ink);
            background: var(--white);
        }

        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--ink);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .panel-meta {
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            margin-top: 4px;
        }

        .tracks {
            padding: 7px 12px 12px;
        }

        .track {
            display: grid;
            grid-template-columns: 32px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 15px 8px;
            border-bottom: 1px solid var(--paper-dark);
            transition: 140ms ease;
        }

        .track:hover {
            background: var(--green);
            color: var(--paper);
        }
        .track:hover * {
            color: var(--paper) !important;
        }

        .track:last-child {
            border-bottom: 0;
        }

        .track-number {
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
        }

        .track-title {
            font-weight: 800;
            font-size: 13px;
        }

        .track-artist {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        .track-views {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            text-align: right;
        }

        .track-growth {
            color: var(--positive-text);
            font-size: 10px;
            margin-top: 3px;
            text-align: right;
        }

        .mini-card {
            padding: 24px;
            background: var(--ink);
            color: var(--white);
        }

        .mini-card .eyebrow {
            color: var(--green);
        }

        .mini-card h2 {
            font-size: 30px;
            line-height: 1.02;
            letter-spacing: -0.07em;
        }

        .mini-card p {
            color: #555860;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 16px;
        }

        .mini-line {
            height: 1px;
            background: #34373d;
            margin: 25px 0;
        }

        .mini-highlight {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
        }

        .mini-highlight strong {
            color: var(--blue);
            font-weight: 500;
            text-align: right;
        }

        .profile-chart {
            margin-top: 12px;
        }

        .chart-wrap {
            padding: 22px 20px 16px;
        }

        .chart {
            width: 100%;
            height: 190px;
            display: block;
            background:
                linear-gradient(to bottom, transparent 49.5%, var(--paper-dark) 50%, transparent 50.5%);
            background-size: 100% 48px;
        }

        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 34px;
            padding: 0 11px;
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 140ms ease;
        }

        .theme-toggle:hover {
            background: var(--ink);
            color: var(--white);
        }

        [data-theme="light"] {
            --paper: #e9e5dc;
            --paper-dark: #d8d3c8;
            --ink: #17181c;
            --muted: #686b72;
            --line: #b9b5ac;
            --blue: #304cff;
            --green: #b9f227;
            --coral: #ff715b;
            --white: #f8f6f0;
            --positive-text: #4f7600;
        }

        @media (max-width: 850px) {

            .profile-header,
            .profile-content {
                align-items: flex-start;
                flex-direction: column;
            }

            .profile-content {
                display: grid;
                grid-template-columns: 1fr;
            }

            .profile-stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .page {
                padding: 17px;
            }

            .profile-title {
                align-items: flex-start;
                flex-direction: column;
            }

            .topbar .live-status {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">S</div>
                <span>Spicy Monitor</span>
            </div>

            <div style="display: flex; align-items: center; gap: 18px;">
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
                    <span id="theme-toggle-icon">☾</span>
                    <span id="theme-toggle-label">Dark</span>
                </button>

                <div class="live-status">
                    <span class="live-dot"></span>
                    Live database
                </div>
            </div>
        </header>

        <main>
            <section class="profile-header">
                <div>
                    <button class="back-button" onclick="goBack()">
                        ← Back to dashboard
                    </button>

                    <div class="profile-title" style="margin-top: 35px;">
                        <div class="profile-avatar" id="profile-avatar">--</div>

                        <div>
                            <div class="eyebrow" id="profile-rank">Author profile / Rank #--</div>
                            <h1 id="profile-name">@username</h1>
                            <div class="profile-caption" id="profile-updated">
                                Last updated 2 minutes ago
                            </div>
                        </div>
                    </div>
                </div>

                <button class="back-button" id="export-json-btn">
                    Export JSON ↓
                </button>
            </section>

            <section class="profile-stats">
                <article class="profile-stat">
                    <div class="profile-stat-label">Total views</div>
                    <div class="profile-stat-value" id="stat-views">...</div>
                </article>

                <article class="profile-stat">
                    <div class="profile-stat-label">24h growth</div>
                    <div class="profile-stat-value" id="stat-growth">...</div>
                </article>

                <article class="profile-stat">
                    <div class="profile-stat-label">Tracks</div>
                    <div class="profile-stat-value" id="stat-tracks">...</div>
                </article>
            </section>

            <section class="panel profile-chart">
                <div class="panel-heading">
                    <div>
                        <h2 class="panel-title">Profile activity</h2>
                        <div class="panel-meta">Total views over the last 30 days</div>
                    </div>

                    <div class="panel-meta" id="profile-chart-growth-header">+0.0%</div>
                </div>

                <div class="chart-wrap" style="position: relative;">
                    <svg class="chart" viewBox="0 0 800 190" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="profileArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#ff715b" stop-opacity="0.28" />
                                <stop offset="100%" stop-color="#ff715b" stop-opacity="0" />
                            </linearGradient>
                        </defs>

                        <path id="profile-chart-area-path"
                            d=""
                            fill="url(#profileArea)" />

                        <path id="profile-chart-line-path"
                            d=""
                            fill="none" stroke="#ff715b" stroke-width="4" vector-effect="non-scaling-stroke" />
                    </svg>

                    <div class="chart-labels" id="profile-chart-labels">
                        <span></span>
                    </div>
                </div>
            </section>

            <section class="profile-content" style="margin-top: 12px;">
                <article class="panel">
                    <div class="panel-heading">
                        <div>
                            <h2 class="panel-title">Top tracks</h2>
                            <div class="panel-meta">Sorted by total views</div>
                        </div>
                    </div>

                    <div class="tracks" id="tracks-list">
                        <!-- Rendered dynamically -->
                    </div>
                </article>

                <aside class="mini-card">
                    <div class="eyebrow">Performance note</div>

                    <h2 id="perf-headline">
                        ...
                    </h2>

                    <p id="perf-desc">
                        ...
                    </p>

                    <div class="mini-line"></div>

                    <div class="mini-highlight">
                        <span>Best track</span>
                        <strong id="perf-best-track">...</strong>
                    </div>

                    <div class="mini-line"></div>

                    <div class="mini-highlight">
                        <span>Weekly growth</span>
                        <strong id="perf-growth-pct">...</strong>
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = 'https://spicy-api.glyph-labs.site/api';
        let profileData = null;
        let username = null;

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initLiveIndicator();
            username = getUsername();
            if (!username) {
                showError('No username provided in the URL.');
                return;
            }
            loadProfile();
        });

        // Theme
        function initTheme() {
            const savedTheme = localStorage.getItem('spicy-theme');
            const preferredTheme = savedTheme || (
                window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'light'
                    : 'dark'
            );

            applyTheme(preferredTheme);

            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.dataset.theme || 'dark';
                    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
                });
            }
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem('spicy-theme', theme);

            const icon = document.getElementById('theme-toggle-icon');
            const label = document.getElementById('theme-toggle-label');

            if (icon) icon.textContent = theme === 'dark' ? '☾' : '☀';
            if (label) label.textContent = theme === 'dark' ? 'Dark' : 'Light';
        }

        // Animate live dot
        function initLiveIndicator() {
            const dot = document.querySelector('.live-dot');
            if (dot) {
                dot.style.animation = 'pulse 2s infinite ease-in-out';
                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes pulse {
                        0% { transform: scale(1); opacity: 1; }
                        50% { transform: scale(1.25); opacity: 0.6; }
                        100% { transform: scale(1); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
        }

        function getUsername() {
            const urlParams = new URLSearchParams(window.location.search);
            let name = urlParams.get('username');
            if (name) return name.trim().replace(/^@/, '');

            const pathParts = window.location.pathname.split('/');
            const cleanParts = pathParts.filter(Boolean);
            if (cleanParts.length >= 2 && cleanParts[cleanParts.length - 2] === 'user') {
                return cleanParts[cleanParts.length - 1].trim().replace(/^@/, '');
            }
            const lastPart = cleanParts[cleanParts.length - 1];
            if (lastPart && !lastPart.endsWith('.html') && lastPart !== 'user') {
                return lastPart.trim().replace(/^@/, '');
            }
            return null;
        }

        // Formatters
        function formatViews(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(2).replace(/\.00$/, '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        function formatFullNumber(num) {
            return num.toLocaleString('en-US');
        }

        function parseUTCDate(dateStr) {
            if (!dateStr) return null;
            let s = dateStr.trim();
            if (!s.endsWith('Z') && !s.includes('+')) {
                s = s.replace(' ', 'T') + 'Z';
            }
            return new Date(s);
        }

        function timeAgo(dateStr) {
            const date = parseUTCDate(dateStr);
            if (!date) return 'never';
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hr${diffHours > 1 ? 's' : ''} ago`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
        }

        async function loadProfile() {
            showLoading();
            try {
                // First, fetch dashboard to find the rank
                let rankText = 'Rank #--';
                try {
                    const dashRes = await fetch(`${API_BASE}/dashboard`);
                    if (dashRes.ok) {
                        const dashData = await dashRes.json();
                        const userIdx = dashData.users.findIndex(u => u.username.toLowerCase() === username.toLowerCase());
                        if (userIdx !== -1) {
                            rankText = `Rank #${(userIdx + 1).toString().padStart(2, '0')}`;
                        }
                    }
                } catch (e) {
                    console.error('Failed to resolve rank', e);
                }
                
                const res = await fetch(`${API_BASE}/user/${username}`);
                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error(`Profile @${username} was not found in the Spicy database.`);
                    } else {
                        throw new Error('Failed to load profile details.');
                    }
                }
                profileData = await res.json();
                
                renderProfile(rankText);
            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function showLoading() {
            document.getElementById('profile-name').textContent = `@${username}...`;
            document.getElementById('profile-updated').textContent = 'Loading profile details...';
            document.getElementById('tracks-list').innerHTML = `
                <div style="padding: 30px; text-align: center; color: var(--muted); font-family: 'DM Mono', monospace;">
                    Loading tracks...
                </div>
            `;
        }

        function showError(msg) {
            document.getElementById('profile-name').textContent = 'Error';
            document.getElementById('profile-updated').style.color = 'var(--coral)';
            document.getElementById('profile-updated').textContent = msg;
            document.getElementById('tracks-list').innerHTML = `
                <div style="padding: 30px; text-align: center; color: var(--coral); font-family: 'DM Mono', monospace; border: 1px solid var(--coral); background: rgba(255,113,91,0.05);">
                    ${msg}
                    <div style="margin-top: 15px;">
                        <button class="back-button" onclick="goBack()" style="background: var(--white);">Return to Dashboard</button>
                    </div>
                </div>
            `;
        }

        function renderProfile(rankText) {
            if (!profileData) return;
            
            const initials = username.substring(0, 2).toUpperCase();
            document.getElementById('profile-avatar').textContent = initials;
            document.getElementById('profile-rank').textContent = `Author profile / ${rankText}`;
            document.getElementById('profile-name').textContent = `@${profileData.username}`;
            
            let updatedTime = null;
            if (profileData.chart_data && profileData.chart_data.length > 0) {
                updatedTime = profileData.chart_data[profileData.chart_data.length - 1].x;
            }
            document.getElementById('profile-updated').textContent = updatedTime ? `Last updated ${timeAgo(updatedTime)}` : 'No update history';
            
            document.getElementById('stat-views').textContent = formatViews(profileData.total_views);
            
            const growth = profileData.growth24h;
            const growthSign = growth >= 0 ? '+' : '';
            document.getElementById('stat-growth').textContent = `${growthSign}${formatViews(growth)}`;
            document.getElementById('stat-tracks').textContent = profileData.total_songs;
            
            const exportBtn = document.getElementById('export-json-btn');
            if (exportBtn) {
                exportBtn.onclick = () => {
                    window.location.href = `${API_BASE}/export/${profileData.username}`;
                };
            }
            
            renderChart();
            renderTracks();
            renderPerformanceNote();
        }

        function renderChart() {
            const svgArea = document.getElementById('profile-chart-area-path');
            const svgLine = document.getElementById('profile-chart-line-path');
            const labelsContainer = document.getElementById('profile-chart-labels');
            
            if (!svgArea || !svgLine || !profileData.chart_data || profileData.chart_data.length < 2) return;
            
            const points = profileData.chart_data;
            
            const firstVal = points[0].y;
            const lastVal = points[points.length - 1].y;
            const totalGrowthPct = firstVal > 0 ? ((lastVal - firstVal) / firstVal * 100).toFixed(1) : '0';
            const totalGrowthSign = lastVal >= firstVal ? '+' : '';
            
            const growthEl = document.getElementById('profile-chart-growth-header');
            if (growthEl) {
                growthEl.textContent = `${totalGrowthSign}${totalGrowthPct}%`;
                growthEl.style.color = lastVal >= firstVal ? 'var(--positive-text)' : 'var(--coral)';
            }
            
            const minViews = Math.min(...points.map(p => p.y));
            const maxViews = Math.max(...points.map(p => p.y));
            
            const width = 800;
            const height = 190;
            const paddingLeft = 0;
            const paddingRight = 0;
            const paddingTop = 25;
            const paddingBottom = 10;
            
            const chartHeight = height - paddingTop - paddingBottom;
            const chartWidth = width - paddingLeft - paddingRight;
            
            const pointsCount = points.length;
            const scaledPoints = points.map((p, i) => {
                const x = paddingLeft + (i / (pointsCount - 1 || 1)) * chartWidth;
                const y = height - paddingBottom - ((p.y - minViews) / (maxViews - minViews || 1)) * chartHeight;
                return { x, y, date: p.x, views: p.y };
            });
            
            let linePathStr = '';
            scaledPoints.forEach((p, i) => {
                const cmd = i === 0 ? 'M' : 'L';
                linePathStr += `${cmd} ${p.x.toFixed(1)} ${p.y.toFixed(1)} `;
            });
            
            const areaPathStr = linePathStr + `L ${width} ${height} L 0 ${height} Z`;
            
            svgArea.setAttribute('d', areaPathStr);
            svgLine.setAttribute('d', linePathStr);
            
            labelsContainer.innerHTML = '';
            const labelIndices = [
                0, 
                Math.floor(pointsCount * 0.2), 
                Math.floor(pointsCount * 0.4), 
                Math.floor(pointsCount * 0.6), 
                Math.floor(pointsCount * 0.8), 
                pointsCount - 1
            ].filter(idx => idx >= 0 && idx < pointsCount);
            
            const uniqueIndices = [...new Set(labelIndices)].sort((a,b)=>a-b);
            
            uniqueIndices.forEach(idx => {
                const p = scaledPoints[idx];
                const dateObj = parseUTCDate(p.date);
                const formattedDate = dateObj ? dateObj.toLocaleDateString('en-US', { month: 'short', day: '2-digit' }) : '';
                const label = document.createElement('span');
                label.textContent = formattedDate;
                labelsContainer.appendChild(label);
            });
            
            setupProfileChartTooltip(scaledPoints);
        }

        function setupProfileChartTooltip(scaledPoints) {
            const chartWrap = document.querySelector('.profile-chart .chart-wrap');
            const svgElement = document.querySelector('.profile-chart .chart');
            let tooltip = document.getElementById('profile-chart-tooltip');
            
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.id = 'profile-chart-tooltip';
                tooltip.style.position = 'absolute';
                tooltip.style.display = 'none';
                tooltip.style.background = 'var(--ink)';
                tooltip.style.color = 'var(--white)';
                tooltip.style.padding = '8px 12px';
                tooltip.style.fontSize = '11px';
                tooltip.style.fontFamily = "'DM Mono', monospace";
                tooltip.style.border = '1px solid var(--line)';
                tooltip.style.boxShadow = '3px 3px 0 var(--line)';
                tooltip.style.pointerEvents = 'none';
                tooltip.style.zIndex = '100';
                chartWrap.appendChild(tooltip);
            }
            
            chartWrap.style.position = 'relative';
            
            svgElement.addEventListener('mousemove', (e) => {
                const rect = svgElement.getBoundingClientRect();
                const mouseX = ((e.clientX - rect.left) / rect.width) * 800;
                
                let closestPt = scaledPoints[0];
                let minDist = Math.abs(closestPt.x - mouseX);
                
                for (let i = 1; i < scaledPoints.length; i++) {
                    const dist = Math.abs(scaledPoints[i].x - mouseX);
                    if (dist < minDist) {
                        minDist = dist;
                        closestPt = scaledPoints[i];
                    }
                }
                
                const dateObj = parseUTCDate(closestPt.date);
                const formattedDate = dateObj ? dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : closestPt.date;
                
                tooltip.style.display = 'block';
                tooltip.innerHTML = `
                    <div style="color: var(--green); font-weight: bold; margin-bottom: 2px;">${formattedDate}</div>
                    <div>Views: ${formatFullNumber(closestPt.views)}</div>
                `;
                
                const tooltipRect = tooltip.getBoundingClientRect();
                const posX = ((closestPt.x / 800) * rect.width);
                const posY = ((closestPt.y / 190) * rect.height) - 10;
                
                let left = posX + 20;
                if (left + tooltipRect.width > rect.width) {
                    left = posX - tooltipRect.width - 20;
                }
                
                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${posY}px`;
            });
            
            svgElement.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        }

        function renderTracks() {
            const list = document.getElementById('tracks-list');
            list.innerHTML = '';
            
            if (!profileData.songs || profileData.songs.length === 0) {
                list.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: var(--muted); font-family: 'DM Mono', monospace;">
                        No track details tracked for this profile.
                    </div>
                `;
                return;
            }
            
            const sortedSongs = [...profileData.songs].sort((a, b) => b.views - a.views);
            
            sortedSongs.forEach((song, i) => {
                const rank = (i + 1).toString().padStart(2, '0');
                const growthSign = song.growth >= 0 ? '+' : '';
                const growthText = `${growthSign}${formatFullNumber(song.growth)}`;
                
                const row = document.createElement('div');
                row.className = 'track';
                row.innerHTML = `
                    <div class="track-number">${rank}</div>
                    <div>
                        <div class="track-title">${song.title}</div>
                        <div class="track-artist">${song.artist}</div>
                    </div>
                    <div>
                        <div class="track-views">${formatViews(song.views)}</div>
                        <div class="track-growth" style="color: ${song.growth >= 0 ? 'var(--positive-text)' : 'var(--coral)'};">${growthText}</div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function renderPerformanceNote() {
            const headline = document.getElementById('perf-headline');
            const desc = document.getElementById('perf-desc');
            const bestTrack = document.getElementById('perf-best-track');
            const growthPct = document.getElementById('perf-growth-pct');
            
            const firstVal = profileData.chart_data && profileData.chart_data.length > 0 ? profileData.chart_data[0].y : 0;
            const lastVal = profileData.chart_data && profileData.chart_data.length > 0 ? profileData.chart_data[profileData.chart_data.length - 1].y : 0;
            const growthVal = lastVal - firstVal;
            const growthPercent = firstVal > 0 ? ((growthVal / firstVal) * 100) : 0;
            const growthSign = growthVal >= 0 ? '+' : '';
            
            let topSong = 'None';
            if (profileData.songs && profileData.songs.length > 0) {
                const sortedByViews = [...profileData.songs].sort((a,b)=>b.views - a.views);
                topSong = sortedByViews[0].title;
            }
            
            let fastSong = '';
            if (profileData.songs && profileData.songs.length > 0) {
                const sortedByGrowth = [...profileData.songs].sort((a,b)=>b.growth - a.growth);
                if (sortedByGrowth[0] && sortedByGrowth[0].growth > 0) {
                    fastSong = sortedByGrowth[0].title;
                }
            }
            
            if (headline) {
                if (growthPercent > 15) {
                    headline.textContent = `This profile is accelerating rapidly, up by ${growthPercent.toFixed(1)}% recently.`;
                } else if (growthPercent > 5) {
                    headline.textContent = `This profile shows steady moderate growth of ${growthPercent.toFixed(1)}%.`;
                } else if (growthPercent >= 0) {
                    headline.textContent = `This profile's view metrics are stable (growth of ${growthPercent.toFixed(1)}%).`;
                } else {
                    headline.textContent = `This profile shows a slight decline in view acceleration.`;
                }
            }
            
            if (desc) {
                if (fastSong) {
                    desc.textContent = `Most of the recent growth in view activity comes from the track “${fastSong}”.`;
                } else {
                    desc.textContent = `Views count has remained consistent across the artist's tracked repertoire.`;
                }
            }
            
            if (bestTrack) bestTrack.textContent = topSong;
            if (growthPct) growthPct.textContent = `${growthSign}${growthPercent.toFixed(1)}%`;
        }

        function goBack() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
