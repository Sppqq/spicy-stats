<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Spicy Monitor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }, colors: { dark: { 900: '#0F111A', 800: '#181A25', 700: '#232535' }, brand: { 500: '#8A2BE2', 400: '#A25DF2', 300: '#c084fc' } } } } }
    </script>
    <style>
        body {
            background-color: #0F111A;
            color: #E2E8F0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0F111A;
        }

        ::-webkit-scrollbar-thumb {
            background: #232535;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3c3f58;
        }

        .glass-panel {
            background: rgba(24, 26, 37, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            animation: slideIn 0.3s forwards;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="antialiased min-h-screen pb-12 flex flex-col items-center">
    <div class="w-full max-w-6xl mt-8 px-6">
        <div
            class="relative bg-gradient-to-br from-[#0F111A] via-dark-800 to-[#1e1533] p-8 sm:p-10 rounded-[32px] overflow-hidden shadow-2xl border border-white/5">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6 relative z-10">
                <div>
                    <h1
                        class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 mb-2">
                        SpicyLyrics Monitor</h1>
                </div>

                <div class="w-full md:w-auto flex flex-col gap-3 glass-panel p-5 rounded-2xl bg-black/20">
                    <div class="flex flex-row gap-2">
                        <input id="newuser"
                            class="flex-1 w-full bg-dark-900 border border-dark-700 text-sm text-white px-4 py-3 rounded-xl focus:outline-none focus:border-brand-500 transition font-mono placeholder:font-sans placeholder:text-slate-600"
                            placeholder="никнейм на сайте..." autocomplete="off">
                        <button onclick="addUserBtn()" id="addbtn"
                            class="bg-gradient-to-b from-brand-400 to-brand-500 hover:from-brand-300 hover:to-brand-400 text-white font-bold px-6 py-3 rounded-xl shadow-[0_0_20px_-5px_#A25DF2] transition">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-8 border-t border-white/5 relative z-10">
                <div class="glass-panel bg-white/5 rounded-2xl p-4 flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex justify-center items-center text-xl">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-[11px] font-bold uppercase tracking-widest">АВТОРОВ</p>
                        <p id="stat-users" class="text-white text-2xl font-bold font-mono mt-0.5">...</p>
                    </div>
                </div>
                <div class="glass-panel bg-white/5 rounded-2xl p-4 flex items-center gap-4 md:col-span-2">
                    <div
                        class="w-12 h-12 rounded-xl bg-fuchsia-500/20 text-fuchsia-400 flex justify-center items-center text-xl">
                        <i class="fa-solid fa-eye"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-[11px] font-bold uppercase tracking-widest">ВСЕГО ПРОСМОТРОВ НА
                            СЕРВИСЕ</p>
                        <p id="stat-views" class="text-white text-2xl font-bold font-mono mt-0.5">...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-6xl mt-8 px-6">
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-2xl font-bold flex items-center gap-3"><i
                    class="fa-solid fa-ranking-star text-brand-500 text-xl"></i> База Авторов</h2>
            <div class="relative w-64">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="liveSearch" placeholder="Найти никнейм..."
                    class="w-full bg-dark-800 border border-white/5 text-sm rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-brand-500 text-slate-200 transition">
            </div>
        </div>

        <div class="glass-panel rounded-[24px] overflow-hidden bg-dark-900/60 shadow-2xl">
            <div class="overflow-x-auto">
                <table id="mainTable" class="w-full whitespace-nowrap">
                    <thead>
                        <tr class="bg-dark-800 border-b border-white/5">
                            <th data-sort="str"
                                class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest w-full">
                                Юзернейм <i class="fa-solid fa-sort ml-1"></i></th>
                            <th data-sort="num"
                                class="px-5 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-widest">
                                Просмотры <i class="fa-solid fa-sort ml-1"></i></th>
                            <th data-sort="num"
                                class="px-5 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-widest text-emerald-500">
                                Рост 24ч <i class="fa-solid fa-sort ml-1"></i></th>
                            <th data-sort="str"
                                class="px-5 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-widest">
                                Обновлено <i class="fa-solid fa-sort ml-1"></i></th>
                        </tr>
                    </thead>
                    <tbody id="user-rows" class="divide-y divide-white/5">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-slate-500">Загрузка данных...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // УКАЖИ ЗДЕСЬ URL ТВОЕГО CLOUDFLARE WORKER (без слеша на конце)
        const API_BASE = "https://spicy-api.glyph-labs.site";

        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const icon = type === 'success' ? '<i class="fa-solid fa-check-circle"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
            const style = type === 'success' ? 'background:rgba(16,185,129,0.1); border-color:#10B981; color:#34D399;' : 'background:rgba(239,68,68,0.1); border-color:#EF4444; color:#F87171;';
            el.className = 'toast'; el.style.cssText = style;
            el.innerHTML = icon + "<span>" + message + "</span>";
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 4000);
        }

        function formatTime(raw) {
            if (!raw) return "—";
            let s = raw.trim();
            if (!s.endsWith('Z') && !s.includes('+') && !s.match(/-\d{2}:\d{2}$/)) s = s.replace(' ', 'T') + 'Z';
            else s = s.replace(' ', 'T');
            const d = new Date(s);
            return isNaN(d.getTime()) ? "—" : d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/api/dashboard`);
                const data = await res.json();

                document.getElementById('stat-users').innerText = data.total_users;
                document.getElementById('stat-views').innerText = data.global_views.toLocaleString('ru-RU');

                const tbody = document.getElementById('user-rows');
                tbody.innerHTML = data.users.map(u => {
                    const growthNode = u.growth > 0
                        ? `<div class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-bold border border-emerald-500/20"><i class="fa-solid fa-arrow-trend-up"></i> ${u.growth.toLocaleString('ru-RU')}</div>`
                        : `<span class="text-slate-600 font-mono text-xs">-</span>`;

                    return `
                  <tr class="group hover:bg-dark-800/80 transition duration-200 search-row">
                    <td class="px-5 py-4 border-b border-white/5">
                      <a href="/user/${u.username}" class="flex items-center gap-3">
                         <div class="w-10 h-10 rounded-full bg-brand-500/10 flex items-center justify-center text-brand-400 group-hover:bg-brand-500 group-hover:text-white transition"><i class="fa-solid fa-user-astronaut"></i></div>
                         <div class="font-bold text-slate-200 group-hover:text-brand-300 transition text-base track-name">@${u.username}</div>
                      </a>
                    </td>
                    <td class="px-5 py-4 text-right border-b border-white/5"><div class="font-mono text-[15px] text-white font-semibold">${u.views ? u.views.toLocaleString('ru-RU') : '⏳'}</div></td>
                    <td class="px-5 py-4 text-right border-b border-white/5">${growthNode}</td>
                    <td class="px-5 py-4 text-right border-b border-white/5"><span class="text-xs text-slate-500 font-mono">${formatTime(u.last_updated)}</span></td>
                  </tr>`;
                }).join('');

                makeTableSortable('mainTable');
            } catch (err) {
                showToast("Ошибка загрузки данных", "error");
            }
        }

        async function addUserBtn() {
            const inp = document.getElementById('newuser'); const btn = document.getElementById('addbtn');
            const val = inp.value.trim(); if (!val) { showToast('Ник не введен', 'error'); return; }
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>'; btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/add-user`, { method: 'POST', body: JSON.stringify({ username: val }), headers: { 'Content-Type': 'application/json' } });
                const json = await res.json();
                if (res.ok) {
                    showToast('Анализируем <b>' + val + '</b>...');
                    setTimeout(() => window.location.href = '/user/' + json.cleanName, 2000);
                } else {
                    showToast(json.error || 'Ошибка', 'error');
                    btn.innerHTML = '<i class="fa-solid fa-plus"></i>'; btn.disabled = false;
                }
            } catch (e) {
                showToast('Ошибка сети', 'error');
                btn.innerHTML = '<i class="fa-solid fa-plus"></i>'; btn.disabled = false;
            }
        }

        // Функция сортировки таблицы (оставлена та же)
        function makeTableSortable(tableId) {
            const table = document.getElementById(tableId);
            const ths = table.querySelectorAll('th[data-sort]');
            ths.forEach(th => {
                th.addEventListener('click', () => {
                    const type = th.getAttribute('data-sort');
                    const tBody = table.tBodies[0];
                    const rows = Array.from(tBody.querySelectorAll('tr'));
                    let isAsc = th.classList.contains('asc');

                    rows.sort((a, b) => {
                        let aVal = a.querySelector(`td:nth-child(${th.cellIndex + 1})`).innerText.replace(/[+%,\s]/g, '');
                        let bVal = b.querySelector(`td:nth-child(${th.cellIndex + 1})`).innerText.replace(/[+%,\s]/g, '');
                        if (type === 'num') return isAsc ? aVal - bVal : bVal - aVal;
                        return isAsc ? bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    });

                    ths.forEach(x => { x.classList.remove('asc'); x.querySelector('i').className = "fa-solid fa-sort ml-1 text-slate-600"; });
                    th.classList.toggle('asc', !isAsc);
                    th.querySelector('i').className = !isAsc ? "fa-solid fa-sort-up ml-1 text-brand-400" : "fa-solid fa-sort-down ml-1 text-brand-400";
                    tBody.append(...rows);
                });
            });
        }

        document.getElementById('liveSearch').addEventListener('keyup', e => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.search-row').forEach(row => { row.style.display = row.querySelector('.track-name').textContent.toLowerCase().includes(term) ? '' : 'none'; });
        });

        loadDashboard();
    </script>
</body>

</html>
