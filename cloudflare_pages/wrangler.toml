# Настройки для развертывания Worker в Cloudflare
name = "spicy-stats"
main = "worker.js"
compatibility_date = "2024-03-01"

# Привязка вашей базы данных D1
[[d1_databases]]
binding = "DB"                               # Обязательно "DB", так как это используется в worker.js
database_name = "spicy-stats-db"             # Замените на имя вашей D1 базы данных в Cloudflare
database_id = "1b38736f-6c89-43c2-a7f0-28c0287df169"   # Реальный ID вашей D1 базы данных

[observability.logs]
enabled = true
invocation_logs = true

# Это позволяет скрипту ОТПРАВЛЯТЬ в очередь (через env.SCRAPE_QUEUE)
[[queues.producers]]
queue = "spicy-scrape-queue"
binding = "SCRAPE_QUEUE"

# Это заставляет скрипт ПОЛУЧАТЬ из очереди (вызывает функцию queue() в скрипте)
[[queues.consumers]]
queue = "spicy-scrape-queue"
# Указываем, сколько профилей за раз берет ОДИН инстанс (ставим 1 для максимальной безопасности CPU)
max_batch_size = 1
max_retries = 2
